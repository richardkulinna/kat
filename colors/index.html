<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Farbharmonien, HSL-Farbwahl, Paletten und kulinna.art-Akzente">
  <title>Colors (KAT-C) – Kulinna Artistic Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Montserrat:wght@400&amp;display=swap">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./harmony.css">
  <link rel="stylesheet" href="./free.css">
  <link rel="stylesheet" href="./palette.css">
  <link rel="stylesheet" href="./brand.css">
  <script type="module" src="./shell.mjs"></script>
  <script type="module" src="./index.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Zum Inhalt</a>
  <header class="masthead">
    <div class="site-width">
      <div class="mast-nav">
        <a class="site-brand" href="../index.html">Kulinna Artistic Tools</a>
        <form data-web-logout hidden method="post" action="/logout"><button type="submit">Abmelden</button></form>
      </div>
      <div class="mast-title"><h1>Colors</h1></div>
    </div>
  </header>
  <main class="site-width colors" id="workspace">

    <div class="colors-workbench">
      <div class="mode-rail">
        <h2 class="rail-title">Farbwerkzeuge</h2>
        <div class="mode-tabs" role="tablist" aria-label="Farbwerkzeug" hidden>
        <button id="harmony-tab" type="button" role="tab" aria-selected="true" aria-controls="harmony-picker">Harmony Selector</button>
        <button id="free-tab" type="button" role="tab" aria-selected="false" aria-controls="free-picker" tabindex="-1">Freier Picker</button>
        <button id="palette-tab" type="button" role="tab" aria-selected="false" aria-controls="palette-picker" tabindex="-1">Palette &amp; Kontrast</button>
        <button id="brand-tab" type="button" role="tab" aria-selected="false" aria-controls="brand-picker" tabindex="-1">kulinna.art-Picker</button>
      </div>
    <details data-sensory hidden>
      <summary>Ton &amp; Haptik</summary>
      <fieldset aria-describedby="sensory-help">
        <legend>Optionale Rückmeldung</legend>
        <div class="picker-actions">
          <label><input type="checkbox" data-sensory-sound> Leiser Rastklick</label>
          <label><input type="checkbox" data-sensory-haptics> Kurze Vibration</label>
        </div>
        <p id="sensory-help">Beim Drehen der Scheibe und Verschieben der Farbstifte. Beides ist anfangs aus. Vibration hängt von Browser und Gerät ab.</p>
        <p data-sensory-status role="status"></p>
      </fieldset>
    </details>
      </div>
      <div class="picker-panels">
        <p id="colors-loading" role="status">Farbwerkzeug wird geladen …</p>
        <noscript><p>Aktiviere JavaScript, um das Farbwerkzeug zu verwenden.</p></noscript>
        <div class="picker-panel" id="harmony-picker" role="tabpanel" aria-labelledby="harmony-tab" tabindex="0" hidden></div>
        <div class="picker-panel" id="free-picker" role="tabpanel" aria-labelledby="free-tab" tabindex="0" hidden></div>
        <div class="picker-panel" id="palette-picker" role="tabpanel" aria-labelledby="palette-tab" tabindex="0" hidden></div>
        <div class="picker-panel" id="brand-picker" role="tabpanel" aria-labelledby="brand-tab" tabindex="0" hidden></div>
      </div>
    </div>
  </main>
</body>
</html>
