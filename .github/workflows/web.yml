name: Studio Web
on: [push, pull_request]
permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test
      - run: node web/build.mjs
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/kat-browser" --no-save playwright-core@1.56.1
      - name: Check sign-in, studio tools and responsive layout
        run: node web/browser-check.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/kat-browser/node_modules
          CHROME_BIN: /usr/bin/google-chrome
