name: Windows x64

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Build unsigned portable app
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged app startup
        shell: pwsh
        run: |
          $env:KAT_SMOKE_LOG = Join-Path $env:RUNNER_TEMP 'kat-smoke.log'
          $process = Start-Process -FilePath (Resolve-Path 'dist/KAT-Windows-x64.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'KAT startup test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $env:KAT_SMOKE_LOG) { Get-Content -LiteralPath $env:KAT_SMOKE_LOG }
            throw "KAT startup test failed with exit code $($process.ExitCode)."
          }
      - name: Upload portable EXE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KAT-Windows-x64
          path: dist/KAT-Windows-x64.exe
          if-no-files-found: error
          compression-level: 0
